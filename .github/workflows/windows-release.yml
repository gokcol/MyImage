name: Windows installer and portable ZIP
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package and attach installers to (empty builds current commit only)
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      # The application always comes from the release tag. Installer tooling may
      # be newer, allowing packaging-only additions without moving release tags.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}
          path: source
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: packaging-tools
      - name: Validate release source
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+(?:\.[0-9]+)?(?:-build[0-9]+)?$') { throw 'Invalid release tag.' }
          $tagVersion = ($env:RELEASE_TAG -replace '^v','') -replace '-build[0-9]+$',''
          if ($tagVersion -match '^[0-9]+\.[0-9]+$') { $tagVersion += '.0' }
          $version = (Select-String -Path source/Cargo.toml -Pattern '^version = "([0-9]+\.[0-9]+\.[0-9]+)"').Matches[0].Groups[1].Value
          if ($tagVersion -ne $version) { throw 'Release tag does not match application version.' }
          [xml]$plist = Get-Content source/packaging/macos/Info.plist -Raw
          $build = $plist.SelectSingleNode("/plist/dict/key[text()='CFBundleVersion']/following-sibling::string[1]").InnerText
          if ($env:RELEASE_TAG -match '-build([0-9]+)$' -and $Matches[1] -ne $build) { throw 'Release tag does not match build number.' }
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build installer and portable ZIP (unsigned)
        shell: pwsh
        run: '& ./packaging-tools/scripts/package-windows.ps1 -SourceDirectory ./source -OutputDirectory ./dist/windows'
      - name: Test installation, upgrade and uninstall
        shell: pwsh
        run: '& ./packaging-tools/scripts/test-windows-installer.ps1 -OutputDirectory ./dist/windows'
      - uses: actions/upload-artifact@v4
        with:
          name: MyImage-Windows-x64-installers
          path: dist/windows/*
          if-no-files-found: error
      - name: Attach to release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $assets = @(Get-ChildItem dist/windows -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          "Windows downloads are unsigned; interactive device validation is pending. Installer lifecycle checks passed." >> $env:GITHUB_STEP_SUMMARY
