name: Windows build — UNTESTED
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach the untested package to (optional)
        required: false
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Build native Windows executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      # A production signing step must run here once the maintainer's provider
      # is configured. Never substitute a self-signed test certificate.
      - name: Require a trusted production signature before publishing
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature target/x86_64-pc-windows-msvc/release/myimage.exe
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
            throw 'Windows release signing is not configured or did not produce a valid timestamped signature. No Windows release download will be published.'
          }
      - name: Package untested build
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package version' }
          $version = ($metadata.packages | Where-Object name -eq 'myimage').version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid package version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $file = "dist/MyImage-$version-windows-x64-UNTESTED.zip"
          "archive=$file" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force dist/MyImage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/myimage.exe dist/MyImage/MyImage.exe
          Copy-Item LICENSE dist/MyImage/LICENSE.txt
          Copy-Item assets/stamps/LICENSE-GRAPHICS dist/MyImage/Twemoji-LICENSE.txt
          Copy-Item assets/stamps/ATTRIBUTION.txt dist/MyImage/Twemoji-ATTRIBUTION.txt
          @"
          MyImage $version — Windows x64 — UNTESTED
          This package was compiled on GitHub Actions. It has NOT been tested interactively on Windows.
          Screen capture, shortcuts, clipboard, scaling and installation require real-device validation.
          $(
            $signature = Get-AuthenticodeSignature dist/MyImage/MyImage.exe
            if ($signature.Status -eq 'Valid') {
              "Windows Authenticode signature verified. Signing does not replace interactive testing or guarantee SmartScreen reputation."
            } else {
              "Unsigned QA build only. Not a signed public release."
            }
          )
          Extract the complete folder and run MyImage.exe. No administrator rights or service installation are required.
          To update, save your work and quit MyImage from its tray menu before replacing the extracted folder.
          To uninstall, quit and delete only this application folder. Pictures/MyImage, projects, settings and recovery copies are preserved.
          Source and releases: https://github.com/gokcol/MyImage
          "@ | Set-Content dist/MyImage/READ-ME-UNTESTED.txt
          Compress-Archive -Path dist/MyImage -DestinationPath $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: MyImage-Windows-x64-UNTESTED
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+(?:\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?)?$') { throw 'Invalid release tag' }
          $tagVersion = $env:RELEASE_TAG.Substring(1)
          if ($tagVersion -match '^[0-9]+\.[0-9]+$') { $tagVersion += '.0' }
          if ($tagVersion -ne $env:PACKAGE_VERSION) { throw 'Release tag does not match package version' }
          gh release upload $env:RELEASE_TAG $env:PACKAGE_ARCHIVE "$($env:PACKAGE_ARCHIVE).sha256" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
