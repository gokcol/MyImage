name: Native text recognition
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ocr*'
      - 'src/ocr/**'
      - 'src/text_extract.rs'
      - 'src/screen_text.rs'
      - '.github/workflows/ocr.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Prepare native English recognition on the disposable runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $capability = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0'
          if (-not $capability) { throw 'Runner does not offer the English OCR capability.' }
          if ($capability.State -ne 'Installed') {
            $result = $capability | Add-WindowsCapability -Online
            if ($result.RestartNeeded) { throw 'OCR installation requires restarting the runner.' }
          }
          [Windows.Media.Ocr.OcrEngine, Windows.Foundation, ContentType=WindowsRuntime] | Out-Null
          $languages = @([Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages)
          if (-not ($languages | Where-Object { $_.LanguageTag -like 'en-*' })) {
            throw 'English OCR is not available on this runner.'
          }
      - name: Recognize actual image text through native and selected-region routes
        shell: powershell
        run: |
          cargo test --locked --bin myimage -- --ignored ocr::windows::tests::windows_native_ocr_reads_both_lines editor::text_extract::tests::selected_region_reads_only_visible_selected_text --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native OCR validation failed.' }
